name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website / bilingual trial flow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check browser script syntax
        run: |
          node --check docs/app.js
          node --check docs/guide.js
      - name: Check website paths, language behavior and download checksum
        run: node scripts/check-site.mjs
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Show environment
        run: |
          python --version
          git --version
      - name: Check prerequisites without running the demo
        run: python -B start_demo.py --check
      - name: Run automated tests
        run: python -B -m unittest discover -s tests -v
      - name: Run public demo
        run: python -B -m phoenix_continuity_gate demo-record
      - name: Install local package into the runner environment
        run: python -m pip install --disable-pip-version-check --no-deps .
      - name: Check installed entry point outside the source tree
        run: python -I scripts/check-installed.py
      - name: Create disposable team-integration project
        id: fixture
        run: python -I scripts/ci-fixture.py create
      - name: Explicitly refresh fixture evidence through the composite action
        uses: ./
        with:
          config: ${{ steps.fixture.outputs.config }}
          check: unit
          mode: refresh
      - name: Inspect unchanged fixture through the composite action
        uses: ./
        with:
          config: ${{ steps.fixture.outputs.config }}
          check: unit
      - name: Make a normal fixture edit
        run: python -I scripts/ci-fixture.py change
      - name: Confirm stale fixture is blocked
        id: stale
        continue-on-error: true
        uses: ./
        with:
          config: ${{ steps.fixture.outputs.config }}
          check: unit
      - name: Assert negative control really failed
        env:
          STALE_OUTCOME: ${{ steps.stale.outcome }}
          STALE_DECISION: ${{ steps.stale.outputs.decision }}
        run: python -c "import os; assert os.environ['STALE_OUTCOME'] == 'failure'; assert os.environ['STALE_DECISION'] == 'NEEDS_FRESH_EVIDENCE'"
