# Copy to the consumer repository's .github/workflows only after reviewing it.
# Before production, replace the candidate tag with its tested full commit SHA.
name: Phoenix configured evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: project
          persist-credentials: false
      - name: Check out fixed Phoenix candidate beside the target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zhanghilbert0323-boop/phoenix-continuity-gate
          ref: v1.0.0-rc1
          path: phoenix-tool
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install reviewed Phoenix source
        run: python -m pip install --no-deps ./phoenix-tool
      # Review project/phoenix.toml and install its trusted test prerequisites first.
      # This step explicitly runs the configured command once.
      - name: Refresh unit evidence
        uses: ./phoenix-tool
        with:
          config: project/phoenix.toml
          check: unit
          mode: refresh
      # Place separately authorized work here if appropriate. Any repository change
      # may stale the evidence; the final gate does not repair or retry it.
      - name: Inspect before a separately defined next step
        uses: ./phoenix-tool
        with:
          config: project/phoenix.toml
          check: unit
